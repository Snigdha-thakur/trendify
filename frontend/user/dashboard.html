<script>(function(){var _p=0,_h=null,_f=window.fetch;function _show(){clearTimeout(_h);var l=document.getElementById('tfy-loader');if(l){l.classList.remove('tfy-done');}}function _hide(){_h=setTimeout(function(){if(_p<=0){var l=document.getElementById('tfy-loader');if(l){var lb=l.querySelector('.tfy-label');if(lb)lb.textContent='Please wait...';l.classList.add('tfy-done');}setTimeout(function(){var l2=document.getElementById('tfy-loader');if(l2&&l2.parentNode)l2.parentNode.removeChild(l2);},450);}},120);}window.fetch=function(){_p++;_show();return _f.apply(this,arguments).finally(function(){_p=Math.max(0,_p-1);if(_p===0)_hide();});};window.addEventListener('load',function(){if(_p===0)_hide();});})();</script>

<script>
function initUser(){
  var u=null;try{u=JSON.parse(localStorage.getItem('trendify_user'));}catch(e){}
  if(!u) return;
  var ini=(u.name||'US').split(' ').map(function(w){return w[0];}).join('').toUpperCase().slice(0,2);
  document.getElementById('sbAv').textContent=ini;
  document.getElementById('sbName').textContent=u.name||'User';
  document.getElementById('sbAv2').textContent=ini;
  document.getElementById('sbName2').textContent=u.name||'User';
  document.getElementById('sbEmail2').textContent=(u.email&&u.email.trim())||(u.username&&u.username.trim())||u.id||u._id||'';
  var navAv=document.getElementById('navAv');if(navAv)navAv.textContent=ini;
}

function toggleUserMenu(e){e.stopPropagation();e.preventDefault();var p=document.getElementById('userPopup');if(p)p.classList.toggle('open');}

document.addEventListener('DOMContentLoaded',function(){var btn=document.getElementById('signOutBtn');if(btn)btn.addEventListener('click',function(){localStorage.removeItem('trendify_access_token');localStorage.removeItem('trendify_user');window.location.href='../signin.html';});});

function toggleSidebar(){document.getElementById('sidebar').classList.toggle('expanded');}

initUser();
</script>

<script src="user-dashboard.js"></script>
