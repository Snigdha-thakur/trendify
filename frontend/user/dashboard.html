<script>(function(){var _p=0,_h=null,_f=window.fetch;function _show(){clearTimeout(_h);var l=document.getElementById('tfy-loader');if(l){l.classList.remove('tfy-done');}}function _hide(){_h=setTimeout(function(){if(_p<=0){var l=document.getElementById('tfy-loader');if(l){var lb=l.querySelector('.tfy-label');if(lb)lb.textContent='Please wait...';l.classList.add('tfy-done');}setTimeout(function(){var l2=document.getElementById('tfy-loader');if(l2&&l2.parentNode)l2.parentNode.removeChild(l2);},450);}},120);}window.fetch=function(){_p++;_show();return _f.apply(this,arguments).finally(function(){_p=Math.max(0,_p-1);if(_p===0)_hide();});};window.addEventListener('load',function(){if(_p===0)_hide();});})();</script>

<script type="module" src="../js/auth-api.js"></script>
<script type="module" src="../js/cursor.js"></script>
<script>
(function() {
  var user = TrendifyAuth.requireAuth('../signin.html');
  if (!user) return;
  if (user.role !== 'user') {
    alert('Access denied. User account required.');
    window.location.href = '../signin.html';
    return;
  }
  var ini = (user.name || 'U').split(' ').map(function(w) { return w[0]; }).join('').toUpperCase().slice(0, 2);
  document.querySelectorAll('.sb-av').forEach(function(el) { el.textContent = ini; });
  document.querySelectorAll('.sb-name').forEach(function(el) { el.textContent = user.name || 'User'; });
  document.querySelectorAll('.sb-plan').forEach(function(el) { el.textContent = (user.email&&user.email.trim())||(user.username&&user.username.trim())||user.id||user._id||''; });
})();

document.querySelectorAll('a[href="../signin.html"]').forEach(function(el) {
  el.addEventListener('click', async function(e) { e.preventDefault(); await TrendifyAuth.logout(); window.location.href = '../signin.html'; });
});

function toggleSidebar() { document.getElementById('adminSidebar').classList.toggle('collapsed'); }
function toggleUserMenu() { event.stopPropagation(); document.getElementById('userPopup').classList.toggle('open'); }

document.addEventListener('click', function(e) {
  var popup = document.getElementById('userPopup'), user = document.getElementById('sbUser');
  if (popup && !popup.contains(e.target) && !user.contains(e.target)) popup.classList.remove('open');
});
</script>
